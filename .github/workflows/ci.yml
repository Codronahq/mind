name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # The default torch wheel is the CUDA build: it drags in cuda-toolkit,
      # cublas, cudnn, cufft, cusolver, cusparse, nccl, nvshmem and triton,
      # gigabytes of it, on a runner with no GPU. Stage A is CPU-viable by
      # design, so torch comes from the CPU index first and the line below then
      # finds it already satisfied rather than re-resolving it.
      - name: Install torch (CPU build, no CUDA stack)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -e ".[dev,fit]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Types
        run: mypy src tests

      - name: Tests
        run: pytest --cov=codrona_mind
