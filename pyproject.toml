[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codrona-mind"
version = "0.0.0"
description = "Skill modelling, adaptive recommendation, and coaching agents for Codrona"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# torch is an extra rather than a dependency because nothing outside the fit
# needs it, and it is a few hundred megabytes on every install that does not.
# CI installs ".[dev,fit]" anyway: the fit is the most numerically delicate code
# in this repo and leaving it untypechecked to save install time is the wrong
# saving. Pip caching absorbs most of the cost.
# Install this from the CPU index or pip resolves the CUDA build and pulls
# gigabytes of nvidia packages onto a machine that will not use them:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[dev,fit]"
fit = [
  "torch>=2.4",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codrona_mind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
